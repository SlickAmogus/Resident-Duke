// Resident Duke controls, executed by EDuke32 at startup (copied to autoexec.cfg).
// RE1 PC layout: tank movement, aim, action, run, status screen.
unbindall
bind "Up" "gamefunc_Move_Forward"
bind "W" "gamefunc_Move_Forward"
bind "Down" "gamefunc_Move_Backward"
bind "S" "gamefunc_Move_Backward"
bind "Left" "gamefunc_Turn_Left"
bind "A" "gamefunc_Turn_Left"
bind "Right" "gamefunc_Turn_Right"
bind "D" "gamefunc_Turn_Right"
// Aim (RE "ready weapon").
bind "X" "gamefunc_Alt_Fire"
// Action: interact / fire / confirm.
bind "C" "gamefunc_Open"
bind "Space" "gamefunc_Open"
bind "Enter" "gamefunc_Open"
// Run / cancel.
bind "V" "gamefunc_Run"
bind "LShift" "gamefunc_Run"
bind "RShift" "gamefunc_Run"
// RE status screen (inventory).
bind "Tab" "gamefunc_Inventory"
bind "Z" "gamefunc_Inventory"
bind "I" "gamefunc_Inventory"
bind "F12" "screenshot"
bind "`" "toggleconsole"
// Movement is RE tank control: no mouse look, no autorun, no crosshair.
in_mouse 0
cl_autorun 0
crosshair 0
cl_showcoords 0
hud_messages 0
hud_showmapname 0
hud_stats 0
r_texfilter 0
